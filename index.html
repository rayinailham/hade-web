<!doctype html>
<html lang="id-ID">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/hade-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0f" media="(prefers-color-scheme: dark)" />

    <!-- Disable browser scroll-restoration BEFORE any paint, so refresh
         never flashes the previous scroll position (e.g. footer) before
         IntroScreen / route veil takes over. -->
    <script>
      try {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        window.scrollTo(0, 0);
      } catch (e) {}
    </script>

    <!-- Primary meta -->
    <title>Adapter Lensa DSLR &amp; Mirrorless ke HP &mdash; Hade Creative</title>
    <meta name="description" content="Adapter clamp, direc sensor, bracket tele, dan grip Bluetooth. Pasang lensa DSLR/mirrorless ke HP. Diskon 10% via WhatsApp. Sukabumi sejak 2017." />
    <meta name="author" content="Hade Creative Production" />
    <meta name="application-name" content="Hade Creative" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />
    <meta name="google-site-verification" content="-NYd5ZfjT43fYs-z8oiSLbYmcM4EVoH3U-iB5w9AtpE" />

    <!-- Canonical (per-route override via @unhead/vue) -->
    <link rel="canonical" href="https://hade-web.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hade Creative" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="Adapter Lensa DSLR &amp; Mirrorless ke HP &mdash; Hade Creative" />
    <meta property="og:description" content="Adapter clamp, direc sensor, bracket tele, grip Bluetooth. Diskon 10% via WhatsApp + gratis ongkir." />
    <meta property="og:url" content="https://hade-web.vercel.app/" />
    <meta property="og:image" content="https://hade-web.vercel.app/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hade Creative &mdash; adapter lensa DSLR ke HP" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adapter Lensa DSLR &amp; Mirrorless ke HP &mdash; Hade Creative" />
    <meta name="twitter:description" content="Adapter clamp, direc sensor, bracket tele, grip Bluetooth. Diskon 10% via WA." />
    <meta name="twitter:image" content="https://hade-web.vercel.app/og-default.jpg" />
    <meta name="twitter:image:alt" content="Hade Creative &mdash; adapter lensa DSLR ke HP" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload the two latin woff2 files used by the H1 headline (Geist 500
         for "Lensa profesional." and Fraunces 300 for the italic "Smartphone
         kamu."). Without this, late font load causes a visible flash on the
         hero word-by-word reveal. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="https://fonts.gstatic.com/s/geist/v5/gyByhwUxId8gMEwcGFU.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="https://fonts.gstatic.com/s/fraunces/v38/6NU78FyLNQOQZAnv9bYEvDiIdE9Ea92uemAk_WBq8U_9v0c2Wa0KxC9TeA.woff2" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
